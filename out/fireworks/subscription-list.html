<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubscriptionList</title>
  <script src="https://unpkg.com/htmx.org@2" defer></script>
  <style>
    .vstack { display: flex; flex-direction: column; gap: 0.5rem; }
    .hstack { display: flex; flex-direction: row;    gap: 0.5rem; }
    .cto-view { padding: 1rem; }
  </style>
</head>
<body>
<div id="subscription-list-view" class="certo-view"
     hx-get="/subscription-list" hx-trigger="load" hx-swap="innerHTML">
    <div class="vstack">
      <h2>Subscriptions</h2>
      <div class="hstack">
        <button hx-get="/subscription/new" hx-swap="outerHTML">New Subscription</button>
        <label>Search<input name="search" type="text"></label>
      </div>
      <!-- For loop: render list here -->
    </div>
</div>
</body>
</html>
