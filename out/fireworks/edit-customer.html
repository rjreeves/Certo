<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EditCustomer</title>
  <script src="https://unpkg.com/htmx.org@2" defer></script>
  <style>
    .field { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 1rem; }
    label { font-weight: bold; }
    input, textarea, select { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; }
    .cto-form { max-width: 480px; padding: 1rem; }
  </style>
</head>
<body>
<!-- TODO: on_submit handler — set hx-post to your endpoint or use a server route -->
<form id="edit-customer-form" class="certo-form"
      hx-post="/customer"
      hx-swap="outerHTML">
  <div class="field">
    <label for="custType">custType</label>
    <input id="custType" name="custType" type="text" required>
  </div>
  <div class="field">
    <label for="custStatus">custStatus</label>
    <input id="custStatus" name="custStatus" type="text" required>
  </div>
  <div class="field">
    <label for="custName1">custName1</label>
    <input id="custName1" name="custName1" type="text" required>
  </div>
  <div class="field">
    <label for="custName2">custName2</label>
    <input id="custName2" name="custName2" type="text" required>
  </div>
  <div class="field">
    <label for="custAddress1">custAddress1</label>
    <input id="custAddress1" name="custAddress1" type="text" required>
  </div>
  <div class="field">
    <label for="custAddress2">custAddress2</label>
    <input id="custAddress2" name="custAddress2" type="text" required>
  </div>
  <div class="field">
    <label for="custTown">custTown</label>
    <input id="custTown" name="custTown" type="text" required>
  </div>
  <div class="field">
    <label for="custPostcode">custPostcode</label>
    <input id="custPostcode" name="custPostcode" type="text" required>
  </div>
  <div class="field">
    <label for="custContact">custContact</label>
    <input id="custContact" name="custContact" type="text" required>
  </div>
  <div class="field">
    <label for="custPhone">custPhone</label>
    <input id="custPhone" name="custPhone" type="text" required>
  </div>
  <div class="field">
    <label for="custEmail">custEmail</label>
    <input id="custEmail" name="custEmail" type="text" required>
  </div>
  <div class="field">
    <label for="custBillCycle">custBillCycle</label>
    <input id="custBillCycle" name="custBillCycle" type="text" required>
  </div>
  <div class="field">
    <label for="custNextBill">custNextBill</label>
    <input id="custNextBill" name="custNextBill" type="text" required>
  </div>
  <div class="field">
    <label for="custCreditCde">custCreditCde</label>
    <input id="custCreditCde" name="custCreditCde" type="text" required>
  </div>
  <div class="field">
    <label for="custLimit">custLimit</label>
    <input id="custLimit" name="custLimit" type="text" required>
  </div>
  <button type="submit">Submit</button>
</form>
</body>
</html>
