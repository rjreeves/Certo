[package]
name        = "certo-testrunner"
version     = "0.1.0"
edition     = "2021"
license = "MIT"
description = "Test runner for the Certo programming language"

[[bin]]
name = "certo-test"
path = "src/main.rs"

[dependencies]
certo-ast         = { path = "../ast" }
certo-parser      = { path = "../parser" }
certo-hir         = { path = "../hir" }
certo-mir         = { path = "../mir" }
certo-codegen     = { path = "../codegen" }
certo-stdlib      = { path = "../stdlib" }
certo-diagnostics = { path = "../diagnostics" }
certo-fmt         = { path = "../fmt" }
tempfile          = "3"
serde_json        = "1"
