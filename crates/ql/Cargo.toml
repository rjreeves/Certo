[package]
name    = "certo-ql"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "QL: a typed query language checked against a Certo schema and lowered to SQL"

[dependencies]
certo-ast         = { path = "../ast" }
certo-diagnostics = { path = "../diagnostics" }
certo-sdl         = { path = "../sdl" }
certo-sql         = { path = "../sql" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

[dev-dependencies]
certo-mdl = { path = "../mdl" }
postgres  = { version = "0.19", features = ["with-chrono-0_4", "with-uuid-1"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono    = "0.4"
uuid      = "1"
rust_decimal = { version = "1", features = ["db-postgres"] }
mysql     = "25"
