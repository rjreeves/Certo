[package]
name    = "certo-ql"
version = "0.1.0"
edition = "2024"
description = "QL: a typed query language checked against a Certo schema and lowered to SQL"

[dependencies]
certo-ast         = { path = "../ast" }
certo-diagnostics = { path = "../diagnostics" }
certo-sdl         = { path = "../sdl" }
certo-sql         = { path = "../sql" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

[dev-dependencies]
certo-mdl = { path = "../mdl" }
postgres  = "0.19"
