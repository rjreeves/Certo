[package]
name    = "certo-runner"
version = "0.1.0"
edition = "2024"
description = "Migration project files, history tracking and execution for Certo schemas"

[dependencies]
certo-diagnostics    = { path = "../diagnostics" }
certo-sdl            = { path = "../sdl" }
certo-mdl            = { path = "../mdl" }
certo-sql            = { path = "../sql" }
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
toml                 = "0.8"
sha2                 = "0.10"
postgres             = "0.19"
postgres-native-tls  = "0.5"
native-tls           = "0.2"

[dev-dependencies]
tempfile = "3"
