[package]
name    = "certo-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "certo-ffi"
path = "src/main.rs"

[dependencies]
certo-ast    = { path = "../ast" }
certo-parser = { path = "../parser" }
# Predicts the exported symbol name, including codegen's `certo_user_` rename
# for functions that would collide with a C-runtime helper.
certo-codegen = { path = "../codegen" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
