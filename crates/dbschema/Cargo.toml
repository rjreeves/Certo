[package]
name    = "certo-dbschema"
version = "0.1.0"
edition = "2024"

[dependencies]
certo-ast   = { path = "../ast" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
postgres    = { version = "0.19", optional = true }

[features]
live = ["dep:postgres"]

[dev-dependencies]
certo-parser  = { path = "../parser" }
