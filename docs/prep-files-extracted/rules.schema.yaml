# =============================================================================
# BUSINESS RULES SCHEMA
# =============================================================================
# Defines the behavioural constraints governing what operations are permitted,
# when, and for whom. Rules reference entities from entities.yaml and types,
# enums, temporal windows, and constraints from prepared-items.yaml.
#
# From rule definitions, the generator produces:
#   - C# validator classes       (application layer enforcement)
#   - PL/pgSQL functions         (database layer enforcement)
#   - API middleware guards       (endpoint protection)
#   - State machine transitions  (for entities with status enums)
#   - Test cases                 (one per condition branch)
#   - Documentation              (human readable rule catalogue)
#
# CONDITION NODE STRUCTURE (recursive):
#   Composite nodes combine child conditions:
#     all:  [ConditionNode]   ALL children must pass (AND)
#     any:  [ConditionNode]   AT LEAST ONE child must pass (OR)
#     none: [ConditionNode]   NO children must pass (NOT ANY)
#
#   Leaf nodes evaluate a single field:
#     field:    string        dot-notation path e.g. user.verified, order.total
#     operator: string        from operators list in prepared-items.yaml
#     value:    any           literal value OR dot-notation field reference
#     unit:     string        time unit for temporal operators (days/hours etc)
#
#   Named constraint reference (from prepared-items.yaml):
#     constraint: string      constraint id e.g. within_credit_limit
#
#   Named temporal reference (from prepared-items.yaml):
#     temporal: string        temporal id e.g. standard_void_window
#     field:    string        the timestamp field to measure age of
#     operator: string        age_lt | age_gt | age_lte | age_gte
# =============================================================================

version: "1.0"

# -----------------------------------------------------------------------------
# RULES
#
# Schema:
#   id:           string        REQUIRED unique identifier (snake_case)
#   description:  string        REQUIRED human readable rule description
#   entity:       string        REQUIRED entity this rule applies to
#   trigger:      string        REQUIRED operation that activates this rule
#                               place | void | issue | pay | apply_discount
#                               create | update | delete | transition
#   priority:     integer       conflict resolution — higher wins (default: 0)
#   depends_on:   [string]      rule ids that must pass before this is evaluated
#   overrides:    string        rule id this rule suspends when its condition passes
#   condition:    ConditionNode REQUIRED see structure above
#   error:
#     code:       string        REQUIRED machine readable error code (UPPER_SNAKE)
#     message:    string        REQUIRED human readable error message
#   targets:
#     api:
#       middleware: bool        generate API guard middleware (default: true)
#       layer:      string      before_handler | after_handler (default: before)
#     ui:
#       behaviour:  string      disable_field | hide_field | show_warning
#       field:      string      field name the behaviour applies to
#       tooltip:    string      tooltip shown to user when behaviour activates
#     test:
#       generate:   bool        generate test cases (default: true)
#       cases:      list        explicit test cases to generate
#         label:    string      test case description
#         [field]:  any         field values for this case (dot notation as keys)
#         expected: string      pass | fail
#     docs:
#       visible:    bool        include in generated documentation (default: true)
#       category:   string      documentation category grouping
# -----------------------------------------------------------------------------
rules:

  # ---------------------------------------------------------------------------
  # ORDER RULES
  # ---------------------------------------------------------------------------

  - id: order_requires_verified_account
    description: A user must have a verified account before placing an order
    entity: Order
    trigger: place
    priority: 10
    condition:
      constraint: user_is_verified    # named constraint from prepared items
    error:
      code: ACCOUNT_NOT_VERIFIED
      message: "Account must be verified before placing orders"
    targets:
      api:
        middleware: true
        layer: before_handler
      ui:
        behaviour: disable_field
        field: submitOrder
        tooltip: "Verify your account to place orders"
      test:
        generate: true
        cases:
          - label: verified user can place order
            user.verified: true
            expected: pass
          - label: unverified user cannot place order
            user.verified: false
            expected: fail
      docs:
        visible: true
        category: Orders

  - id: order_requires_inventory
    description: An order line cannot be placed if the product has no inventory
    entity: OrderLine
    trigger: place
    depends_on:
      - order_requires_verified_account   # only check if account rule passes
    condition:
      field: product.inventoryCount
      operator: gt
      value: 0
    error:
      code: INSUFFICIENT_INVENTORY
      message: "Product is out of stock"
    targets:
      api:
        middleware: true
        layer: before_handler
      ui:
        behaviour: show_warning
        field: quantity
        tooltip: "This product is currently out of stock"
      test:
        generate: true
        cases:
          - label: product in stock
            product.inventoryCount: 5
            expected: pass
          - label: product out of stock
            product.inventoryCount: 0
            expected: fail
      docs:
        visible: true
        category: Orders

  - id: order_total_within_credit_limit
    description: An order total must not exceed the user's available credit limit
    entity: Order
    trigger: place
    depends_on:
      - order_requires_verified_account
    condition:
      constraint: within_credit_limit     # named constraint from prepared items
    error:
      code: CREDIT_LIMIT_EXCEEDED
      message: "Order total exceeds your available credit limit"
    targets:
      api:
        middleware: true
        layer: before_handler
      test:
        generate: true
        cases:
          - label: total within limit
            order.total: 100
            user.creditLimit: 500
            expected: pass
          - label: total equals limit
            order.total: 500
            user.creditLimit: 500
            expected: pass
          - label: total exceeds limit
            order.total: 501
            user.creditLimit: 500
            expected: fail
      docs:
        visible: true
        category: Orders

  - id: order_payment_method_required
    description: >
      A non-prepaid order requires the user to have a payment method on file,
      unless the user is an admin
    entity: Order
    trigger: place
    condition:
      any:
        - constraint: user_is_admin         # admins bypass payment check
        - field: user.paymentMethod
          operator: eq
          value: PREPAID
        - field: user.paymentMethod
          operator: exists
    error:
      code: NO_PAYMENT_METHOD
      message: "A payment method is required to place this order"
    targets:
      api:
        middleware: true
        layer: before_handler
      docs:
        visible: true
        category: Orders

  # ---------------------------------------------------------------------------
  # ORDER LINE RULES
  # ---------------------------------------------------------------------------

  - id: discount_within_margin
    description: A discount applied to an order line cannot exceed the product margin
    entity: OrderLine
    trigger: apply_discount
    condition:
      field: discount.amount
      operator: lte
      value: product.margin               # field reference — compares two fields
    error:
      code: DISCOUNT_EXCEEDS_MARGIN
      message: "Discount cannot exceed the product margin"
    targets:
      api:
        middleware: true
        layer: before_handler
      ui:
        behaviour: disable_field
        field: discount.amount
        tooltip: "Cannot exceed product margin"
      test:
        generate: true
        cases:
          - label: discount equals margin
            discount.amount: 10
            product.margin: 10
            expected: pass
          - label: discount below margin
            discount.amount: 5
            product.margin: 10
            expected: pass
          - label: discount exceeds margin
            discount.amount: 15
            product.margin: 10
            expected: fail
      docs:
        visible: true
        category: Pricing

  - id: admin_discount_override
    description: Admin users may apply discounts exceeding the product margin
    entity: OrderLine
    trigger: apply_discount
    overrides: discount_within_margin       # suspends the margin rule for admins
    priority: 20                            # higher than discount_within_margin
    condition:
      constraint: user_is_admin
    error:
      code: NOT_ADMIN                       # only reached if condition fails
      message: "Only admins can override discount limits"
    targets:
      docs:
        visible: true
        category: Pricing

  # ---------------------------------------------------------------------------
  # INVOICE RULES
  # ---------------------------------------------------------------------------

  - id: invoice_void_within_window
    description: An invoice can only be voided within the standard void window
    entity: Invoice
    trigger: void
    condition:
      all:
        - temporal: standard_void_window    # named temporal from prepared items
          field: createdAt
          operator: age_lt
        - field: status
          operator: not_eq
          value: PAID
    error:
      code: INVOICE_VOID_WINDOW_EXPIRED
      message: "Invoice cannot be voided after 30 days or once paid"
    targets:
      api:
        middleware: true
        layer: before_handler
      ui:
        behaviour: hide_field
        field: voidButton
      test:
        generate: true
        cases:
          - label: invoice within window and unpaid
            createdAt.age_days: 10
            status: ISSUED
            expected: pass
          - label: invoice outside window
            createdAt.age_days: 31
            status: ISSUED
            expected: fail
          - label: invoice within window but paid
            createdAt.age_days: 5
            status: PAID
            expected: fail
      docs:
        visible: true
        category: Invoices

  - id: invoice_void_admin_override
    description: Admin users may void invoices outside the standard void window
    entity: Invoice
    trigger: void
    overrides: invoice_void_within_window
    priority: 20
    condition:
      constraint: user_is_admin
    error:
      code: NOT_ADMIN
      message: "Only admins can void invoices outside the void window"
    targets:
      docs:
        visible: true
        category: Invoices

  - id: invoice_requires_issued_status
    description: An invoice must be in ISSUED status before it can be paid
    entity: Invoice
    trigger: pay
    condition:
      field: status
      operator: eq
      value: ISSUED
    error:
      code: INVOICE_NOT_PAYABLE
      message: "Only issued invoices can be marked as paid"
    targets:
      api:
        middleware: true
        layer: before_handler
      test:
        generate: true
        cases:
          - label: issued invoice can be paid
            status: ISSUED
            expected: pass
          - label: draft invoice cannot be paid
            status: DRAFT
            expected: fail
          - label: already paid invoice cannot be paid again
            status: PAID
            expected: fail
      docs:
        visible: true
        category: Invoices
