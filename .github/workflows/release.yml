name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: certo.exe
            archive: certo-windows-x86_64.zip
            archive_cmd: zip

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: certo
            archive: certo-linux-x86_64.tar.gz
            archive_cmd: tar

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: certo
            archive: certo-macos-aarch64.tar.gz
            archive_cmd: tar

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --bin certo --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.archive_cmd == 'zip'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          Compress-Archive -Path $bin -DestinationPath ${{ matrix.archive }}

      - name: Package (Unix)
        if: matrix.archive_cmd == 'tar'
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          tar czf ${{ matrix.archive }} -C "$(dirname $bin)" "$(basename $bin)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Certo ${{ steps.version.outputs.version }}
          body: |
            ## Install

            ### Download binary (no Rust required)

            | Platform | Download |
            |----------|----------|
            | Windows x86-64 | `certo-windows-x86_64.zip` |
            | Linux x86-64   | `certo-linux-x86_64.tar.gz` |
            | macOS ARM64    | `certo-macos-aarch64.tar.gz` |

            Extract the archive and put the `certo` binary somewhere on your `PATH`.

            **Prerequisites:** a C compiler must be on your PATH (`clang`, `gcc`, or `cc`).
            On Windows, install [LLVM](https://releases.llvm.org/) or use MinGW.

            ### Install from source

            ```sh
            cargo install --git https://github.com/rjreeves/Certo --bin certo
            ```

            ---
            See [CHANGELOG](https://github.com/rjreeves/Certo/blob/master/CHANGELOG.md) for what changed.
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
