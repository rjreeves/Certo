name: Host sanitizers

on:
  push:
    paths:
      - "crates/stdlib/src/host.rs"
      - "crates/cli/src/main.rs"
      - "crates/cli/tests/host_integration.rs"
      - ".github/workflows/host-sanitizers.yml"
  pull_request:
    paths:
      - "crates/stdlib/src/host.rs"
      - "crates/cli/src/main.rs"
      - "crates/cli/tests/host_integration.rs"
      - ".github/workflows/host-sanitizers.yml"

jobs:
  address-sanitizer:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run native host sanitizer stress test
        run: cargo test -p certo --test host_integration sanitizer_stress -- --nocapture

  thread-sanitizer:
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run native host concurrency test under ThreadSanitizer
        run: cargo test -p certo --test host_integration thread_sanitizer_ -- --nocapture

  windows-stress:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run portable native host stress test
        run: cargo test -p certo --test host_integration are_stable -- --nocapture
