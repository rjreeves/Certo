name: Host sanitizers

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Reproducible randomized lifecycle stress seed
        required: false
        default: "1"
      iterations:
        description: Randomized lifecycle stress iterations
        required: false
        default: "500"
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - "crates/stdlib/src/host.rs"
      - "crates/cli/src/main.rs"
      - "crates/cli/tests/host_integration.rs"
      - "crates/cli/tests/host_benchmarks.rs"
      - ".github/workflows/host-sanitizers.yml"
  pull_request:
    paths:
      - "crates/stdlib/src/host.rs"
      - "crates/cli/src/main.rs"
      - "crates/cli/tests/host_integration.rs"
      - "crates/cli/tests/host_benchmarks.rs"
      - ".github/workflows/host-sanitizers.yml"

jobs:
  observability-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run high-contention observability regression gate
        run: cargo test -p certo --test host_benchmarks --release -- --ignored --nocapture

  address-sanitizer:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run native host sanitizer stress test
        run: cargo test -p certo --test host_integration sanitizer_stress -- --nocapture
      - name: Run scheduled randomized lifecycle stress under AddressSanitizer
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CERTO_HOST_STRESS_SANITIZER: address
          CERTO_HOST_STRESS_SEED: ${{ github.event.inputs.seed || github.run_id }}
          CERTO_HOST_STRESS_ITERATIONS: ${{ github.event.inputs.iterations || '500' }}
          CERTO_HOST_STRESS_ARTIFACT_DIR: artifacts/address-sanitizer
          CERTO_HOST_STRESS_SECRET_CANARY: certo-sanitizer-secret-canary
        run: cargo test -p certo --test host_integration randomized_lifecycle_stress -- --ignored --nocapture
      - name: Upload AddressSanitizer failure artifacts
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: randomized-host-address-sanitizer-${{ github.run_id }}
          path: artifacts/address-sanitizer
          if-no-files-found: error
          retention-days: 14

  thread-sanitizer:
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run native host concurrency test under ThreadSanitizer
        run: cargo test -p certo --test host_integration thread_sanitizer_ -- --nocapture
      - name: Run scheduled randomized lifecycle stress under ThreadSanitizer
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CERTO_HOST_STRESS_SANITIZER: thread
          CERTO_HOST_STRESS_SEED: ${{ github.event.inputs.seed || github.run_id }}
          CERTO_HOST_STRESS_ITERATIONS: ${{ github.event.inputs.iterations || '500' }}
          CERTO_HOST_STRESS_ARTIFACT_DIR: artifacts/thread-sanitizer
          CERTO_HOST_STRESS_SECRET_CANARY: certo-sanitizer-secret-canary
        run: cargo test -p certo --test host_integration randomized_lifecycle_stress -- --ignored --nocapture
      - name: Upload ThreadSanitizer failure artifacts
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: randomized-host-thread-sanitizer-${{ github.run_id }}
          path: artifacts/thread-sanitizer
          if-no-files-found: error
          retention-days: 14

  windows-stress:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run portable native host stress test
        run: cargo test -p certo --test host_integration are_stable -- --nocapture
