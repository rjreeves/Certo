<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubscriberDetail</title>
  <script src="https://unpkg.com/htmx.org@2" defer></script>
  <style>
    .vstack { display: flex; flex-direction: column; gap: 0.5rem; }
    .hstack { display: flex; flex-direction: row;    gap: 0.5rem; }
    .cto-view { padding: 1rem; }
  </style>
</head>
<body>
<div id="subscriber-detail-view" class="certo-view"
     hx-get="/subscriber-detail" hx-trigger="load" hx-swap="innerHTML">
    <div class="vstack">
      <h2>Subscriber Detail</h2>
      <div class="hstack">
        <button hx-get="/subscriber/edit" hx-swap="outerHTML">Edit</button>
        <button hx-get="/subscribers" hx-swap="outerHTML">Back</button>
      </div>
      <div class="vstack">
        <h2>Identity</h2>
        <p>Customer No</p>
        <p>Subscriber No</p>
        <p>Status</p>
      </div>
      <div class="vstack">
        <h2>Name &amp; Address</h2>
        <p>Name</p>
        <p>Address</p>
        <p>Town</p>
        <p>Postcode</p>
      </div>
      <div class="vstack">
        <h2>Contact</h2>
        <p>Email</p>
      </div>
    </div>
</div>
</body>
</html>
