apiVersion: apps/v1
kind: Deployment
metadata:
  name: certo-host
spec:
  replicas: 2
  selector:
    matchLabels:
      app: certo-host
  template:
    metadata:
      labels:
        app: certo-host
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: certo-host
          image: example.invalid/certo-host:latest
          ports:
            - name: operations
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /live
              port: operations
          readinessProbe:
            httpGet:
              path: /ready
              port: operations
          startupProbe:
            httpGet:
              path: /live
              port: operations
            failureThreshold: 30
            periodSeconds: 1
